services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: etl4-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  postgres:
    image: postgres:16
    container_name: etl4-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-etl4}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-etl4}
    volumes:
      - pgdata:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:latest
    container_name: etl4-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: etl4-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-change_me}
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: etl4-node-exporter
    ports:
      - "9100:9100"

  spark-master:
    image: apache/spark:3.5.3
    container_name: etl4-spark-master
    user: root
    ports:
      - "8080:8080"     # master web UI
      - "7077:7077"     # cluster coordination
      - "4040:4040"     # driver UI
    environment:
      SPARK_NO_DAEMONIZE: "true"
    command: >
      /opt/spark/bin/spark-class
        org.apache.spark.deploy.master.Master
        --host 0.0.0.0
        --webui-port 8080

  spark-worker-1:
    image: apache/spark:3.5.3
    container_name: etl4-spark-worker-1
    user: root
    environment:
      SPARK_NO_DAEMONIZE: "true"
    command: >
      /opt/spark/bin/spark-class
        org.apache.spark.deploy.worker.Worker
        spark://spark-master:7077
        --webui-port 8081
    ports:
      - "8081:8081"
    depends_on:
      - spark-master

  spark-worker-2:
    image: apache/spark:3.5.3
    container_name: etl4-spark-worker-2
    user: root
    environment:
      SPARK_NO_DAEMONIZE: "true"
    command: >
      /opt/spark/bin/spark-class
        org.apache.spark.deploy.worker.Worker
        spark://spark-master:7077
        --webui-port 8081
    depends_on:
      - spark-master

  # Airflow 3 to be added once the Spark + Kafka wiring is proven end-to-end.

volumes:
  pgdata:
